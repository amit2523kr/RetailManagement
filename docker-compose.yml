services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  retail-platform:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      PORT: 8123
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongodb:27017/retail_platform
      CLIENT_ORIGIN: http://localhost:8123
    ports:
      - "8123:8123"

volumes:
  mongo_data:
